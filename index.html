<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <link href="src/styles/reset.css" rel="stylesheet" />
    <link href="src/styles/style.css" rel="stylesheet" />
    <title>Menumoon</title>
    <meta
      content="Menumoon is a digital menu for your business that offers an elegant user experience"
      name="description"
    />
  </head>

  <body data-app="menumoon" data-mode="view">
    <div class="edit-banner">EDIT MODE</div>
    <div class="app-root" data-component="root">
      <header class="app-header glass">Menumoon</header>
      <main class="app-main">
        <nav class="category-nav glass">
          <ul class="category-list" data-component="category-list"></ul>
        </nav>
        <section class="menu glass" data-component="menu-items">
          <h2 class="hidden-visually">Menu Items</h2>
        </section>
      </main>
      <button
        type="button"
        class="edit-button--float edit-controls"
        data-action="toggle-edit"
      >
        <svg class="edit-button__icon" viewBox="0 0 640 640">
          <title>Editmode Toggle Button</title>
          <path
            fill="currentColor"
            d="M100.4 417.2C104.5 402.6 112.2 389.3 123 378.5L304.2 197.3L338.1 163.4C354.7 180 389.4 214.7 442.1 267.4L476 301.3L442.1 335.2L260.9 516.4C250.2 527.1 236.8 534.9 222.2 539L94.4 574.6C86.1 576.9 77.1 574.6 71 568.4C64.9 562.2 62.6 553.3 64.9 545L100.4 417.2zM156 413.5C151.6 418.2 148.4 423.9 146.7 430.1L122.6 517L209.5 492.9C215.9 491.1 221.7 487.8 226.5 483.2L155.9 413.5zM510 267.4C493.4 250.8 458.7 216.1 406 163.4L372 129.5C398.5 103 413.4 88.1 416.9 84.6C430.4 71 448.8 63.4 468 63.4C487.2 63.4 505.6 71 519.1 84.6L554.8 120.3C568.4 133.9 576 152.3 576 171.4C576 190.5 568.4 209 554.8 222.5C551.3 226 536.4 240.9 509.9 267.4z"
          />
        </svg>
      </button>
    </div>
    <template id="category-card-template">
      <li class="category-list__item">
        <button
          type="button"
          class="category-card"
          data-action="select-category"
        >
          <img class="category-card__image" alt="" />
          <span class="category-card__name"></span>
        </button>
      </li>
    </template>
    <template id="item-card-template">
      <article class="item-card" data-action="select-item">
        <img class="item-card__image" alt="" />
        <div class="item-card__info">
          <h3 class="item-card__name" aria-label="Item Name"></h3>
          <data class="item-card__price"></data>
        </div>
      </article>
    </template>
    <template id="item-modal-template">
      <dialog class="modal item-modal" aria-modal="true">
        <header>
          <h2 class="modal-title">Item Control Panel</h2>
        </header>

        <button type="button" class="modal-close" aria-label="Close modal">
          Close
        </button>

        <form class="item-form" enctype="multipart/form-data">
          <fieldset class="item-info-field">
            <legend>Item Information</legend>

            <label>
              Item Name
              <input
                type="text"
                class="item-name"
                name="ItemName"
                minlength="2"
                maxlength="32"
                data-fill="name"
                required
              />
            </label>

            <label>
              Item Price
              <input
                type="number"
                class="item-price"
                name="ItemPrice"
                min="0"
                max="999999999"
                data-fill="price"
                required
              />
            </label>
          </fieldset>

          <fieldset class="item-image-field">
            <legend>Image Properties</legend>

            <label>
              Set Image
              <input
                type="file"
                accept="image/*"
                class="item-image"
                name="ItemImage"
              />
            </label>

            <p class="img-tip">
              Upload the image that best demonstrates the item
            </p>
            <p class="img-tip">Images should be at least 512x512 pixels</p>
          </fieldset>

          <fieldset class="item-options-field">
            <legend>Item Options</legend>

            <label>
              Contains Allergens?
              <input
                type="checkbox"
                class="item-allergen"
                value="allergens"
                name="AllergenCheck"
                data-fill="allergen"
              />
            </label>

            <label>
              In Stock?
              <input
                type="checkbox"
                class="item-stock"
                name="ItemStock"
                value="Available"
                data-fill="stock"
              />
            </label>
          </fieldset>

          <button type="submit">Save</button>
          <button type="button" class="modal-cancel" formnovalidate>
            Cancel
          </button>
        </form>
      </dialog>
    </template>
    <template id="category-modal-template">
      <dialog class="modal category-modal" aria-modal="true">
        <header>
          <h2 class="modal-title">Category Control Panel</h2>
        </header>

        <button type="button" class="modal-close" aria-label="Close modal">
          Close
        </button>

        <form class="category-form" enctype="multipart/form-data">
          <label>
            Category Name
            <input
              type="text"
              class="category-name"
              name="CategoryName"
              minlength="2"
              maxlength="32"
              data-fill="name"
              required
            />
          </label>

          <label>
            Set Image
            <input
              type="file"
              accept="image/*"
              class="category-image"
              name="CategoryImage"
            />
          </label>

          <p class="img-tip">
            Upload the image that best demonstrates the item
          </p>
          <p class="img-tip">Images should be at least 512x512 pixels</p>

          <button type="submit">Save</button>
          <button type="button" class="modal-cancel" formnovalidate>
            Cancel
          </button>
        </form>
      </dialog>
    </template>
    <script type="module" src="/src/main.js" defer></script>
  </body>
</html>
